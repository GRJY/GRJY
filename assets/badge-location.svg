<svg xmlns="http://www.w3.org/2000/svg" width="148" height="40" viewBox="0 0 148 40" role="img" aria-label="İstanbul, TR">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".14"/>
    </linearGradient>
    <radialGradient id="halo" cx="18%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect x="1" y="1" width="146" height="38" rx="19"/></clipPath>
    <style>
      .f { font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .sh { animation: sh 6s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0.9s; }
      @keyframes sh { 0% { transform: translateX(-90px) } 30% { transform: translateX(168px) } 100% { transform: translateX(168px) } }
      .ha { animation: ha 4s ease-in-out infinite; animation-delay: 0.9s; }
      @keyframes ha { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .sh, .ha { animation: none } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect x="1" y="1" width="146" height="38" rx="19" fill="#0e1428"/>
    <rect x="1" y="1" width="146" height="38" rx="19" fill="url(#g)"/>
    <rect class="ha" x="1" y="1" width="146" height="38" fill="url(#halo)"/>
    <rect class="sh" x="-60" y="-10" width="42" height="60" fill="#ffffff" fill-opacity=".16" transform="skewX(-18)"/>
  </g>
  <rect x="1" y="1" width="146" height="38" rx="19" fill="none" stroke="url(#e)" stroke-width="1.4"/>
  <g transform="translate(15,11) scale(0.75)"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z" fill="#34d399"/></g>
  <text class="f" x="41" y="25" fill="#e6ecff" font-size="13" font-weight="600">İstanbul, TR</text>
