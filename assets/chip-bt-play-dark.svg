<svg xmlns="http://www.w3.org/2000/svg" width="119" height="34" viewBox="0 0 119 34" role="img" aria-label="Google Play">
<style>
  :root {
    --canvas:  #0d1117;
    --surface: #151b23;
    --line:    #3d444d;
    --fg:      #f0f6fc;
    --muted:   #9198a1;
    --faint:   #656c76;
    --accent:  #4493f8;
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .fg { fill: var(--fg); }
  .mut { fill: var(--muted); }
  .fnt { fill: var(--faint); }
  .acc { fill: var(--accent); }
  .surf { fill: var(--surface); }
  .canvas { fill: var(--canvas); }
  .line-f { fill: var(--line); }
  .line-s { stroke: var(--line); }
  .display { font-size: 42px; font-weight: 600; letter-spacing: -1.25px; }
  .lead { font-size: 16.5px; font-weight: 500; letter-spacing: -0.2px; }
  .body { font-size: 13px; }
  .small { font-size: 11.5px; }
  .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px; }
  .metric { font-size: 30px; font-weight: 600; letter-spacing: -0.8px;
            font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
  .e { animation: e 260ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
  @keyframes e {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .grow { animation: grow 520ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box;
          transform-origin: left center; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .e, .grow { animation: none; }
  }
</style>
<rect width="119" height="34" class="canvas"/>
<rect x="0.75" y="0.75" width="117.5" height="32.5" rx="9" class="surf line-s"/>
<g transform="translate(13,9)"><g transform="scale(.667)"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z" fill="var(--muted)"/></g></g>
<text x="34" y="22" class="body fg">Google Play</text>
</svg>
