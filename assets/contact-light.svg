<svg xmlns="http://www.w3.org/2000/svg" width="880" height="196" viewBox="0 0 880 196" role="img" aria-label="Contact — Giray Akbulut">
<style>
  :root {
    --canvas:  #ffffff;
    --surface: #f6f8fa;
    --line:    #d1d9e0;
    --fg:      #1f2328;
    --muted:   #59636e;
    --faint:   #818b98;
    --accent:  #0969da;
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .fg { fill: var(--fg); }
  .mut { fill: var(--muted); }
  .fnt { fill: var(--faint); }
  .acc { fill: var(--accent); }
  .surf { fill: var(--surface); }
  .canvas { fill: var(--canvas); }
  .line-f { fill: var(--line); }
  .line-s { stroke: var(--line); }
  .display { font-size: 42px; font-weight: 600; letter-spacing: -1.25px; }
  .lead { font-size: 16.5px; font-weight: 500; letter-spacing: -0.2px; }
  .body { font-size: 13px; }
  .small { font-size: 11.5px; }
  .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px; }
  .metric { font-size: 30px; font-weight: 600; letter-spacing: -0.8px;
            font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
  .e { animation: e 260ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
  @keyframes e {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .grow { animation: grow 520ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box;
          transform-origin: left center; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .e, .grow { animation: none; }
  }
</style>
<rect width="880" height="196" class="canvas"/>
<g class="e">
<text x="0" y="22" class="eyebrow fnt">CONTACT</text>
<rect x="62" y="18" width="818" height="1" class="line-f"/>
</g>
<text x="0" y="66" class="display fg" style="animation-delay:45ms" font-size="28">Open to freelance and full-time work.</text>
<text x="0" y="92" class="body fnt" style="animation-delay:90ms">Based in İstanbul, working with teams anywhere.</text>
<g class="e" style="animation-delay:135ms">
<g transform="translate(0,124)"><rect x="1" y="2.6" width="18" height="13" rx="2.6" fill="none" stroke="var(--muted)" stroke-width="1.4"/><path d="M1.6 4 10 10.4 18.4 4" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round"/></g>
<text x="30" y="132" class="eyebrow fnt">EMAIL</text>
<text x="30" y="152" class="body fg">akbulutgiray@gmail.com</text>
</g>
<g class="e" style="animation-delay:180ms">
<g transform="translate(300,124)"><g transform="scale(.8)"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z" fill="var(--muted)"/></g></g>
<text x="330" y="132" class="eyebrow fnt">LINKEDIN</text>
<text x="330" y="152" class="body fg">in/giray-akbulut</text>
</g>
<g class="e" style="animation-delay:225ms">
<g transform="translate(600,124)"><path d="M10 1.6a5.6 5.6 0 0 0-5.6 5.6c0 4.2 5.6 10.4 5.6 10.4s5.6-6.2 5.6-10.4A5.6 5.6 0 0 0 10 1.6z" fill="none" stroke="var(--muted)" stroke-width="1.4"/><circle cx="10" cy="7.2" r="2.1" fill="var(--muted)"/></g>
<text x="630" y="132" class="eyebrow fnt">BASED IN</text>
<text x="630" y="152" class="body fg">İstanbul, Türkiye</text>
</g>
<rect x="0" y="178" width="880" height="1" class="line-f e" opacity="1" style="animation-delay:270ms"/>
</svg>
