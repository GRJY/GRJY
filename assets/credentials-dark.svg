<svg xmlns="http://www.w3.org/2000/svg" width="880" height="448" viewBox="0 0 880 448" role="img" aria-label="Stack and certifications">
<style>
  :root {
    --canvas:  #0d1117;
    --surface: #151b23;
    --line:    #3d444d;
    --fg:      #f0f6fc;
    --muted:   #9198a1;
    --faint:   #656c76;
    --accent:  #4493f8;
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .fg { fill: var(--fg); }
  .mut { fill: var(--muted); }
  .fnt { fill: var(--faint); }
  .acc { fill: var(--accent); }
  .surf { fill: var(--surface); }
  .canvas { fill: var(--canvas); }
  .line-f { fill: var(--line); }
  .line-s { stroke: var(--line); }
  .display { font-size: 42px; font-weight: 600; letter-spacing: -1.25px; }
  .lead { font-size: 16.5px; font-weight: 500; letter-spacing: -0.2px; }
  .body { font-size: 13px; }
  .small { font-size: 11.5px; }
  .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px; }
  .metric { font-size: 30px; font-weight: 600; letter-spacing: -0.8px;
            font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
  .e { animation: e 260ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
  @keyframes e {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .grow { animation: grow 520ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box;
          transform-origin: left center; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .e, .grow { animation: none; }
  }
</style>
<rect width="880" height="448" class="canvas"/>
<g class="e">
<text x="0" y="22" class="eyebrow fnt">STACK</text>
<rect x="48" y="18" width="832" height="1" class="line-f"/>
</g>
<g class="e" style="animation-delay:45ms">
<text x="0" y="62" class="small fnt">Languages</text>
<text x="150" y="62" class="body mut">Swift · Python · JavaScript · PHP · Java · C++</text>
<rect x="0" y="73" width="880" height="1" class="line-f" opacity=".55"/>
</g>
<g class="e" style="animation-delay:90ms">
<text x="0" y="96" class="small fnt">Apple</text>
<text x="150" y="96" class="body mut">SwiftUI · Swift 6 Concurrency · Combine · CryptoKit · MapKit</text>
<rect x="0" y="107" width="880" height="1" class="line-f" opacity=".55"/>
</g>
<g class="e" style="animation-delay:135ms">
<text x="0" y="130" class="small fnt">Web &amp; cloud</text>
<text x="150" y="130" class="body mut">Laravel · MySQL · AWS Lambda · DynamoDB · Supabase · REST</text>
<rect x="0" y="141" width="880" height="1" class="line-f" opacity=".55"/>
</g>
<g class="e" style="animation-delay:180ms">
<text x="0" y="164" class="small fnt">Machine learning</text>
<text x="150" y="164" class="body mut">Keras · scikit-learn · TF-IDF · Core ML</text>
<rect x="0" y="175" width="880" height="1" class="line-f" opacity=".55"/>
</g>
<g class="e" style="animation-delay:225ms">
<text x="0" y="198" class="small fnt">Design</text>
<text x="150" y="198" class="body mut">Figma · Framer</text>
</g>
<g class="e" style="animation-delay:270ms">
<text x="0" y="256" class="eyebrow fnt">CERTIFICATIONS</text>
<rect x="110" y="252" width="770" height="1" class="line-f"/>
</g>
<g class="e" style="animation-delay:315ms">
<path d="M1 286v14" class="line-s" stroke-width="2" stroke-linecap="round"/>
<text x="14" y="292" class="body fg">Full Stack Developer</text>
<text x="14" y="308" class="small fnt">Meta</text>
</g>
<g class="e" style="animation-delay:345ms">
<path d="M453 286v14" class="line-s" stroke-width="2" stroke-linecap="round"/>
<text x="466" y="292" class="body fg">AI Engineering</text>
<text x="466" y="308" class="small fnt">IBM</text>
</g>
<g class="e" style="animation-delay:375ms">
<path d="M1 328v14" class="line-s" stroke-width="2" stroke-linecap="round"/>
<text x="14" y="334" class="body fg">Cloud Practitioner</text>
<text x="14" y="350" class="small fnt">Amazon Web Services</text>
</g>
<g class="e" style="animation-delay:405ms">
<path d="M453 328v14" class="line-s" stroke-width="2" stroke-linecap="round"/>
<text x="466" y="334" class="body fg">UX Design</text>
<text x="466" y="350" class="small fnt">Google</text>
</g>
<g class="e" style="animation-delay:435ms">
<path d="M1 370v14" class="line-s" stroke-width="2" stroke-linecap="round"/>
<text x="14" y="376" class="body fg">PCEP — Entry-Level Python</text>
<text x="14" y="392" class="small fnt">Python Institute</text>
</g>
<g class="e" style="animation-delay:465ms">
<path d="M453 370v14" class="line-s" stroke-width="2" stroke-linecap="round"/>
<text x="466" y="376" class="body fg">Java Foundations</text>
<text x="466" y="392" class="small fnt">Oracle</text>
</g>
<g class="e" style="animation-delay:495ms">
<path d="M1 412v14" class="line-s" stroke-width="2" stroke-linecap="round"/>
<text x="14" y="418" class="body fg">Python Coder (GPYC)</text>
<text x="14" y="434" class="small fnt">GIAC</text>
</g>
</svg>
