<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Giray Akbulut — Full Stack and iOS Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0e1428"/>
      <stop offset="100%" stop-color="#070a16"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="878" height="248" rx="26"/></clipPath>

    <style>
      .n  { font-family: ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      tspan.l { animation: pop .7s ease-out both; }
      @keyframes pop { from { opacity: 0 } to { opacity: 1 } }
      tspan.l:nth-of-type(1)  { animation-delay: .00s }
      tspan.l:nth-of-type(2)  { animation-delay: .06s }
      tspan.l:nth-of-type(3)  { animation-delay: .12s }
      tspan.l:nth-of-type(4)  { animation-delay: .18s }
      tspan.l:nth-of-type(5)  { animation-delay: .24s }
      tspan.l:nth-of-type(6)  { animation-delay: .30s }
      tspan.l:nth-of-type(7)  { animation-delay: .36s }
      tspan.l:nth-of-type(8)  { animation-delay: .42s }
      tspan.l:nth-of-type(9)  { animation-delay: .48s }
      tspan.l:nth-of-type(10) { animation-delay: .54s }
      tspan.l:nth-of-type(11) { animation-delay: .60s }
      tspan.l:nth-of-type(12) { animation-delay: .66s }
      tspan.l:nth-of-type(13) { animation-delay: .72s }
      tspan.l:nth-of-type(14) { animation-delay: .78s }

      .role { opacity: 0; animation: role 12s ease-in-out infinite; transform-box: fill-box; }
      @keyframes role {
        0%    { opacity: 0; transform: translateY(10px); }
        4%    { opacity: 1; transform: translateY(0); }
        29%   { opacity: 1; transform: translateY(0); }
        33%   { opacity: 0; transform: translateY(-10px); }
        100%  { opacity: 0; transform: translateY(-10px); }
      }
      .r1 { animation-delay: 0s }
      .r2 { animation-delay: 4s }
      .r3 { animation-delay: 8s }

      .blob { animation: drift 18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .b2   { animation-duration: 23s; animation-delay: -6s }
      .b3   { animation-duration: 28s; animation-delay: -12s }
      @keyframes drift {
        0%   { transform: translate(0,0) scale(1); }
        50%  { transform: translate(38px,-22px) scale(1.14); }
        100% { transform: translate(-30px,18px) scale(.92); }
      }

      .sweep { animation: sweep 9s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes sweep {
        0%   { transform: translateX(-460px); }
        55%  { transform: translateX(980px); }
        100% { transform: translateX(980px); }
      }

      .pill { animation: rise .8s ease-out both; transform-box: fill-box; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .p1 { animation-delay: .9s } .p2 { animation-delay: 1.05s } .p3 { animation-delay: 1.2s }
      .p4 { animation-delay: 1.35s } .p5 { animation-delay: 1.5s } .p6 { animation-delay: 1.65s }

      .dotpulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.35) } }

      @media (prefers-reduced-motion: reduce) {
        tspan.l, .role, .blob, .sweep, .pill, .dotpulse { animation: none; opacity: 1; }
        .r2, .r3 { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="880" height="250" fill="url(#bg)"/>
    <g filter="url(#soft)" opacity=".85">
      <circle class="blob"     cx="140" cy="70"  r="90" fill="#3b82f6"/>
      <circle class="blob b2"  cx="720" cy="60"  r="95" fill="#a855f7"/>
      <circle class="blob b3"  cx="520" cy="215" r="85" fill="#06b6d4"/>
    </g>
    <rect x="0" y="0" width="880" height="250" fill="#050813" opacity=".38"/>
    <rect class="sweep" x="-240" y="-60" width="200" height="380" fill="url(#shine)" transform="skewX(-18)"/>
  </g>
  <rect x="1" y="1" width="878" height="248" rx="26" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>

  <text class="n" x="44" y="98" fill="url(#nameFill)" font-size="46" font-weight="700" letter-spacing="-0.5"
        ><tspan class="l">G</tspan><tspan class="l">i</tspan><tspan class="l">r</tspan><tspan class="l">a</tspan><tspan class="l">y</tspan><tspan class="l"> </tspan><tspan class="l">A</tspan><tspan class="l">k</tspan><tspan class="l">b</tspan><tspan class="l">u</tspan><tspan class="l">l</tspan><tspan class="l">u</tspan><tspan class="l">t</tspan></text>

  <g>
    <circle class="dotpulse" cx="48" cy="130" r="4" fill="#34d399"/>
    <text class="n role r1" x="62" y="135" fill="#cbd5f5" font-size="17" font-weight="500">Full Stack &amp; iOS Developer · İstanbul, Türkiye</text>
    <text class="n role r2" x="62" y="135" fill="#cbd5f5" font-size="17" font-weight="500">Swift 6 · SwiftUI · on-device ML · end-to-end encryption</text>
    <text class="n role r3" x="62" y="135" fill="#cbd5f5" font-size="17" font-weight="500">Native macOS apps · Laravel/PHP platforms · AWS</text>
  </g>

  <text class="n" x="44" y="168" fill="#7f8db3" font-size="13.5">Computer Engineer building performance-critical, security-first products.</text>

  <g class="n" font-size="12" font-weight="600">
    <g class="pill p1"><rect x="44"  y="192" width="74" height="28" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="81"  y="210" fill="#e2e8ff" text-anchor="middle">Swift</text></g>
    <g class="pill p2"><rect x="126" y="192" width="84" height="28" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="168" y="210" fill="#e2e8ff" text-anchor="middle">SwiftUI</text></g>
    <g class="pill p3"><rect x="218" y="192" width="84" height="28" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="260" y="210" fill="#e2e8ff" text-anchor="middle">Python</text></g>
    <g class="pill p4"><rect x="310" y="192" width="66" height="28" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="343" y="210" fill="#e2e8ff" text-anchor="middle">PHP</text></g>
    <g class="pill p5"><rect x="384" y="192" width="66" height="28" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="417" y="210" fill="#e2e8ff" text-anchor="middle">AWS</text></g>
    <g class="pill p6"><rect x="458" y="192" width="94" height="28" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="505" y="210" fill="#e2e8ff" text-anchor="middle">Supabase</text></g>
  </g>
</svg>
