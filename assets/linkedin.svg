<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148" role="img" aria-label="LinkedIn — Giray Akbulut">
<style>
  :root {
    --canvas:  #ffffff;
    --surface: #f6f8fa;
    --line:    #d1d9e0;
    --fg:      #1f2328;
    --muted:   #59636e;
    --faint:   #818b98;
    --accent:  #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:  #0d1117;
      --surface: #151b23;
      --line:    #3d444d;
      --fg:      #f0f6fc;
      --muted:   #9198a1;
      --faint:   #656c76;
      --accent:  #4493f8;
    }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .fg { fill: var(--fg); }
  .mut { fill: var(--muted); }
  .fnt { fill: var(--faint); }
  .acc { fill: var(--accent); }
  .surf { fill: var(--surface); }
  .canvas { fill: var(--canvas); }
  .line-f { fill: var(--line); }
  .line-s { stroke: var(--line); }
  .display { font-size: 42px; font-weight: 600; letter-spacing: -1.25px; }
  .lead { font-size: 16.5px; font-weight: 500; letter-spacing: -0.2px; }
  .body { font-size: 13px; }
  .small { font-size: 11.5px; }
  .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px; }
  .metric { font-size: 30px; font-weight: 600; letter-spacing: -0.8px;
            font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
  .e { animation: e 260ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
  @keyframes e {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .grow { animation: grow 520ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box;
          transform-origin: left center; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .e, .grow { animation: none; }
  }
.name { font-size: 19px; font-weight: 600; letter-spacing: -0.35px; }</style>
<rect width="880" height="148" class="canvas"/>
<g class="e">
<text x="0" y="22" class="eyebrow fnt">LINKEDIN</text>
<rect x="69" y="18" width="811" height="1" class="line-f"/>
</g>
<defs><clipPath id="av"><circle cx="32" cy="82" r="28"/></clipPath></defs>
<g class="e" style="animation-delay:45ms">
<image clip-path="url(#av)" x="4" y="54" width="56" height="56" href="data:image/png;base64,"/>
<circle cx="32" cy="82" r="28.5" fill="none" class="line-s"/>
</g>
<g class="e" style="animation-delay:90ms">
<text x="78" y="74" class="name fg">Giray Akbulut</text>
<text x="78" y="96" class="body mut">Full Stack &amp; iOS Developer · Computer Engineer, Beykent 2025</text>
<text x="78" y="116" class="small fnt">İstanbul, Türkiye  ·  Open to freelance and full-time work</text>
</g>
<g class="e" style="animation-delay:135ms">
<rect x="676" y="64" width="204" height="38" rx="8" class="surf line-s"/>
<g transform="translate(696,75) scale(0.62)"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z" fill="var(--accent)"/></g>
<text x="714" y="88" class="body acc" font-weight="600">Connect on LinkedIn</text>
<path d="M856 82.5h6m-2.6-2.8 2.8 2.8-2.8 2.8" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x="0" y="138" width="880" height="1" class="line-f e" opacity="1" style="animation-delay:180ms"/>
</svg>
