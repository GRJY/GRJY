  </linearGradient>
  <clipPath id="rcard"><rect x="1" y="1" width="878" height="316" rx="24"/></clipPath>
  <style>
    .f { font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .cd { opacity: 0; animation: cd 18s cubic-bezier(.22,1,.36,1) infinite; transform-box: fill-box; }
    @keyframes cd {
      0%   { opacity: 0; transform: translateY(16px) scale(.99); }
      3.5% { opacity: 1; transform: translateY(0) scale(1); }
      44%  { opacity: 1; transform: translateY(0) scale(1); }
      48%  { opacity: 0; transform: translateY(-14px) scale(.99); }
      100% { opacity: 0; transform: translateY(-14px) scale(.99); }
    }
    .lbl { opacity: 0; animation: cd 18s cubic-bezier(.22,1,.36,1) infinite; transform-box: fill-box; }
    .prog { animation: fill 9s linear infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes fill { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }
    .dotfg { opacity: 0; animation: dfg 18s steps(1,end) infinite; }
    @keyframes dfg { 0% { opacity: 1 } 50% { opacity: 0 } 100% { opacity: 0 } }
    .sweepR { animation: swR 18s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes swR { 0% { transform: translateX(-300px) } 11% { transform: translateX(1010px) } 50% { transform: translateX(-300px) } 61% { transform: translateX(1010px) } 100% { transform: translateX(1010px) } }
    @media (prefers-reduced-motion: reduce) {
      .cd, .lbl, .prog, .dotfg, .sweepR { animation: none } .cd, .lbl { opacity: 1 }
      .pageB { display: none }
    }
  </style>
</defs>
