<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img" aria-label="GitHub activity">
<style>
  :root {
    --canvas:  #ffffff;
    --surface: #f6f8fa;
    --line:    #d1d9e0;
    --fg:      #1f2328;
    --muted:   #59636e;
    --faint:   #818b98;
    --accent:  #0969da;
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .fg { fill: var(--fg); }
  .mut { fill: var(--muted); }
  .fnt { fill: var(--faint); }
  .acc { fill: var(--accent); }
  .surf { fill: var(--surface); }
  .canvas { fill: var(--canvas); }
  .line-f { fill: var(--line); }
  .line-s { stroke: var(--line); }
  .display { font-size: 42px; font-weight: 600; letter-spacing: -1.25px; }
  .lead { font-size: 16.5px; font-weight: 500; letter-spacing: -0.2px; }
  .body { font-size: 13px; }
  .small { font-size: 11.5px; }
  .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px; }
  .metric { font-size: 30px; font-weight: 600; letter-spacing: -0.8px;
            font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
  .e { animation: e 260ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
  @keyframes e {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .grow { animation: grow 520ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box;
          transform-origin: left center; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .e, .grow { animation: none; }
  }
</style>
<rect width="880" height="168" class="canvas"/>
<g class="e">
<text x="0" y="22" class="eyebrow fnt">LANGUAGE MIX  ·  ALL REPOSITORIES</text>
<rect x="241" y="18" width="639" height="1" class="line-f"/>
</g>
<g class="e" style="animation-delay:45ms">
<text x="0" y="76" class="metric fg">44</text>
<text x="0" y="96" class="small fnt">Repositories worked in</text>
</g>
<g class="e" style="animation-delay:90ms">
<text x="226" y="76" class="metric fg">40</text>
<text x="226" y="96" class="small fnt">Private repositories</text>
</g>
<g class="e" style="animation-delay:135ms">
<text x="452" y="76" class="metric fg">7</text>
<text x="452" y="96" class="small fnt">Public repositories</text>
</g>
<g class="e" style="animation-delay:180ms">
<text x="678" y="76" class="metric fg">12</text>
<text x="678" y="96" class="small fnt">Total stars</text>
</g>
<g class="grow" style="animation-delay:135ms">
<defs><clipPath id="barclip"><rect x="0" y="118" width="880" height="6" rx="3"/></clipPath></defs>
<g clip-path="url(#barclip)">
<rect x="0.0" y="118" width="267.3" height="6" fill="#4F5D95"/>
<rect x="267.3" y="118" width="220.2" height="6" fill="#8b949e"/>
<rect x="487.5" y="118" width="204.8" height="6" fill="#f7523f"/>
<rect x="692.3" y="118" width="124.6" height="6" fill="#3178c6"/>
<rect x="816.9" y="118" width="63.1" height="6" fill="#563d7c"/>
</g></g>
<g class="e" style="animation-delay:180ms">
<circle cx="4" cy="144" r="4" fill="#4F5D95"/>
<text x="15" y="148" class="small fnt">PHP 30.4%</text>
</g>
<g class="e" style="animation-delay:210ms">
<circle cx="91" cy="144" r="4" fill="#8b949e"/>
<text x="102" y="148" class="small fnt">Dart 25.0%</text>
</g>
<g class="e" style="animation-delay:240ms">
<circle cx="185" cy="144" r="4" fill="#f7523f"/>
<text x="196" y="148" class="small fnt">Blade 23.3%</text>
</g>
<g class="e" style="animation-delay:270ms">
<circle cx="285" cy="144" r="4" fill="#3178c6"/>
<text x="296" y="148" class="small fnt">TypeScript 14.2%</text>
</g>
<g class="e" style="animation-delay:300ms">
<circle cx="417" cy="144" r="4" fill="#563d7c"/>
<text x="428" y="148" class="small fnt">CSS 7.2%</text>
</g>
<text x="880" y="148" class="small fnt mono" text-anchor="end" opacity=".8">updated daily</text>
</svg>
