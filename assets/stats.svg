<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="GitHub statistics for GRJY">
<defs>
  <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c1122"/><stop offset="100%" stop-color="#080b17"/>
  </linearGradient>
  <linearGradient id="sedge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
  </linearGradient>
  <clipPath id="scard"><rect x="1" y="1" width="878" height="248" rx="24"/></clipPath>
  <style>
    .f { font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .in { animation: in 1s ease-out both; transform-box: fill-box; }
    @keyframes in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .bar { animation: grow 1.6s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; transform-origin: left center; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    .sweep3 { animation: sw3 14s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sw3 {
      0% { transform: translateX(-300px) } 14% { transform: translateX(1010px) } 100% { transform: translateX(1010px) }
    }
    @media (prefers-reduced-motion: reduce) {
      .in, .bar, .sweep3 { animation: none } .in { opacity: 1 }
    }
  </style>
</defs>
<g clip-path="url(#scard)">
<rect width="880" height="250" fill="url(#sbg)"/>
<rect class="sweep3" x="-160" y="-40" width="130" height="340" fill="#ffffff" fill-opacity=".05" transform="skewX(-16)"/>
</g>
<rect x="1" y="1" width="878" height="248" rx="24" fill="none" stroke="url(#sedge)" stroke-width="1.5"/>
<text class="f mono" x="44" y="40" fill="#5b6789" font-size="11.5" letter-spacing="2.4">GITHUB AT A GLANCE</text>
<g class="f in" style="animation-delay:0.10s"><text x="44" y="94" fill="#f1f5ff" font-size="34" font-weight="700">7</text><text x="44" y="116" fill="#7f8db3" font-size="11.5">Public repos</text></g>
<g class="f in" style="animation-delay:0.20s"><text x="166" y="94" fill="#f1f5ff" font-size="34" font-weight="700">11</text><text x="166" y="116" fill="#7f8db3" font-size="11.5">Total stars</text></g>
<g class="f in" style="animation-delay:0.30s"><text x="288" y="94" fill="#f1f5ff" font-size="34" font-weight="700">84</text><text x="288" y="116" fill="#7f8db3" font-size="11.5">Contributions (1y)</text></g>
<g class="f in" style="animation-delay:0.40s"><text x="410" y="94" fill="#f1f5ff" font-size="34" font-weight="700">1</text><text x="410" y="116" fill="#7f8db3" font-size="11.5">Followers</text></g>
<text class="f mono in" style="animation-delay:.5s" x="44" y="150" fill="#5b6789" font-size="11.5" letter-spacing="2.4">TOP LANGUAGES</text>
<rect x="44" y="166" width="792" height="12" rx="6" fill="#ffffff" fill-opacity=".06"/>
<clipPath id="barclip"><rect x="44" y="166" width="792" height="12" rx="6"/></clipPath>
<g clip-path="url(#barclip)">
<rect class="bar" x="44.0" y="166" width="526.0" height="12" fill="#F05138" style="animation-delay:0.35s"/>
<rect class="bar" x="570.0" y="166" width="159.4" height="12" fill="#f1e05a" style="animation-delay:0.44s"/>
<rect class="bar" x="729.4" y="166" width="49.7" height="12" fill="#e34c26" style="animation-delay:0.53s"/>
<rect class="bar" x="779.1" y="166" width="39.3" height="12" fill="#663399" style="animation-delay:0.62s"/>
<rect class="bar" x="818.4" y="166" width="15.4" height="12" fill="#3572A5" style="animation-delay:0.71s"/>
<rect class="bar" x="833.8" y="166" width="2.2" height="12" fill="#89e051" style="animation-delay:0.80s"/>
</g>
<g class="f in" style="animation-delay:0.60s"><circle cx="49" cy="210" r="5" fill="#F05138"/><text x="62" y="214" fill="#a9b6d6" font-size="12.5">Swift 66.4%</text></g>
<g class="f in" style="animation-delay:0.68s"><circle cx="152" cy="210" r="5" fill="#f1e05a"/><text x="165" y="214" fill="#a9b6d6" font-size="12.5">JavaScript 20.1%</text></g>
<g class="f in" style="animation-delay:0.76s"><circle cx="290" cy="210" r="5" fill="#e34c26"/><text x="303" y="214" fill="#a9b6d6" font-size="12.5">HTML 6.3%</text></g>
<g class="f in" style="animation-delay:0.84s"><circle cx="379" cy="210" r="5" fill="#663399"/><text x="392" y="214" fill="#a9b6d6" font-size="12.5">CSS 5.0%</text></g>
<g class="f in" style="animation-delay:0.92s"><circle cx="461" cy="210" r="5" fill="#3572A5"/><text x="474" y="214" fill="#a9b6d6" font-size="12.5">Python 1.9%</text></g>
<g class="f in" style="animation-delay:1.00s"><circle cx="564" cy="210" r="5" fill="#89e051"/><text x="577" y="214" fill="#a9b6d6" font-size="12.5">Shell 0.3%</text></g>
<text class="f mono" x="836" y="214" fill="#3f4a68" font-size="10.5" text-anchor="end">auto-generated daily</text>
</svg>