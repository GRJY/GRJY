<svg xmlns="http://www.w3.org/2000/svg" width="880" height="574" viewBox="0 0 880 574" role="img" aria-label="Selected work — open source, products and client platforms">
<style>
  :root {
    --canvas:  #ffffff;
    --surface: #f6f8fa;
    --line:    #d1d9e0;
    --fg:      #1f2328;
    --muted:   #59636e;
    --faint:   #818b98;
    --accent:  #0969da;
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .fg { fill: var(--fg); }
  .mut { fill: var(--muted); }
  .fnt { fill: var(--faint); }
  .acc { fill: var(--accent); }
  .surf { fill: var(--surface); }
  .canvas { fill: var(--canvas); }
  .line-f { fill: var(--line); }
  .line-s { stroke: var(--line); }
  .display { font-size: 42px; font-weight: 600; letter-spacing: -1.25px; }
  .lead { font-size: 16.5px; font-weight: 500; letter-spacing: -0.2px; }
  .body { font-size: 13px; }
  .small { font-size: 11.5px; }
  .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px; }
  .metric { font-size: 30px; font-weight: 600; letter-spacing: -0.8px;
            font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
  .e { animation: e 260ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box; }
  @keyframes e {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .grow { animation: grow 520ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-box: fill-box;
          transform-origin: left center; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .e, .grow { animation: none; }
  }

  .tick { opacity: 0; animation: tick 19200ms linear infinite;
          transform-box: fill-box; }
  @keyframes tick {
    0%      { opacity: 0; transform: translateY(5px); filter: blur(2px); }
    2%      { opacity: 1; transform: translateY(0);   filter: blur(0); }
    10.5% { opacity: 1; transform: translateY(0);   filter: blur(0); }
    12.5%  { opacity: 0; transform: translateY(-5px); filter: blur(2px); }
    100%    { opacity: 0; transform: translateY(-5px); filter: blur(2px); }
  }
  .march { animation: march 24s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -32; } }
  @media (prefers-reduced-motion: reduce) {
    .tick, .march { animation: none; }
    .tick:first-of-type { opacity: 1; }
  }
</style>
